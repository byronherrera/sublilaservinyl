                    // Respaldo para videos muy cortos donde currentTime no dispara seeked adicional
                    setTimeout(() => {
                        if (!settled && video.readyState >= 2) {
                            captureFrame();
                        }
                    }, 220);
                }, { once: true });

                video.addEventListener('error', () => {
                    finish({ dataUrl: null, durationText: '', failed: true });
                }, { once: true });

                video.src = videoUrl;
            });
        }

        function applyVideoThumbResult(cardEl, result) {
            if (!cardEl || !result) return;
            const extLabel = cardEl.getAttribute('data-ext') || 'VIDEO';
            const badgeTextEl = cardEl.querySelector('.video-badge-text');
            if (badgeTextEl && result.durationText) {
                badgeTextEl.textContent = `${extLabel} · ${result.durationText}`;
            }

            if (result.dataUrl && !cardEl.classList.contains('has-video-thumb')) {
                const imgEl = cardEl.querySelector('img.video-generated-thumb');
                if (imgEl) {
                    imgEl.src = result.dataUrl;
                    imgEl.style.display = 'block';
                    cardEl.classList.add('has-video-thumb');
                }
            }
            imagesLoaded++;
        }

        function pumpVideoThumbQueue() {
            while (activeVideoThumbWorkers < MAX_VIDEO_THUMB_WORKERS && videoThumbQueue.length > 0) {
                const { cardEl, src } = videoThumbQueue.shift();
                if (!cardEl || !cardEl.isConnected) continue;

                activeVideoThumbWorkers++;
                extractVideoThumbnail(src)
                    .then((res) => applyVideoThumbResult(cardEl, res))
                    .finally(() => {
                        activeVideoThumbWorkers--;
                        pumpVideoThumbQueue();
                    });
            }
        }

        function observeVideoCardForThumbnail(cardEl) {
            const src = cardEl.getAttribute('data-src');
            if (!src) return;

            if (videoThumbCache.has(src)) {
                applyVideoThumbResult(cardEl, videoThumbCache.get(src));
                return;
            }

            if (!('IntersectionObserver' in window)) {
                videoThumbQueue.push({ cardEl, src });
                pumpVideoThumbQueue();
                return;
            }

            if (!videoThumbObserver) {
                videoThumbObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        const el = entry.target;
                        videoThumbObserver.unobserve(el);
                        const videoSrc = el.getAttribute('data-src');
                        if (videoSrc) {
                            videoThumbQueue.push({ cardEl: el, src: videoSrc });
                            pumpVideoThumbQueue();
                        }
                    });
                }, {
                    root: null,
                    rootMargin: '300px'
                });
            }

            videoThumbObserver.observe(cardEl);
        }

        // Configurar listeners de carga de imágenes nuevas y extracción perezosa de thumbnails de video
        function setupImageListeners() {
            const unboundItems = foldersList.querySelectorAll('.folder-image:not([data-bound="1"])');
            unboundItems.forEach(item => {
                item.setAttribute('data-bound', '1');

                if (item.classList.contains('is-video')) {
                    if (!item.classList.contains('has-video-thumb')) {
                        observeVideoCardForThumbnail(item);
                    } else {
                        imagesLoaded++;
                    }
                    return;
                }

                const imgEl = item.querySelector('img.image-thumb');
                if (!imgEl) return;

                if (imgEl.complete && imgEl.naturalWidth > 0) {
                    imagesLoaded++;
                } else {
                    imgEl.addEventListener('load', () => {
                        imagesLoaded++;
                    }, { once: true });
                    imgEl.addEventListener('error', () => {
                        imgEl.style.opacity = '0.25';
                    }, { once: true });
                }
            });
        }

        // Desconectar observer de scroll infinito activo
        function disconnectInfiniteScroll() {
            if (infiniteObserver) {
                infiniteObserver.disconnect();
                infiniteObserver = null;
            }
            if (scrollFallbackAttached) {
                window.removeEventListener('scroll', handleScrollLoadMore);
                scrollFallbackAttached = false;
            }
        }

        // Solicitar carga del siguiente lote de 50 elementos
        function loadNextBatch() {
            if (isLoadingMore || imagesRendering) return;
            if (imagesRendered >= lightboxImages.length) return;

            isLoadingMore = true;
            setTimeout(() => {
                totalImagesToLoad += batchSize;
                renderFolders();
                isLoadingMore = false;
            }, 150);
        }

        // Configurar IntersectionObserver para scroll infinito (con fallback a evento scroll)
        function setupInfiniteScroll() {
            disconnectInfiniteScroll();

            if (!('IntersectionObserver' in window)) {
                window.addEventListener('scroll', handleScrollLoadMore, { passive: true });
                scrollFallbackAttached = true;
                return;
            }

            infiniteObserver = new IntersectionObserver((entries) => {
                if (entries.some(entry => entry.isIntersecting)) {
                    loadNextBatch();
                }
            }, {
                root: null,
                rootMargin: '250px'
            });

            if (scrollSentinel) {
                infiniteObserver.observe(scrollSentinel);
            }
        }

        // Fallback para navegadores sin IntersectionObserver
        function handleScrollLoadMore() {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                loadNextBatch();
            }
        }

        // Detener y liberar limpiamente el reproductor de video del lightbox
        function stopLightboxVideo() {
            if (!lightboxVideo) return;
            try {
                lightboxVideo.pause();
            } catch (_) {}
            lightboxVideo.removeAttribute('src');
            lightboxVideo.load();
            lightboxVideo.style.display = 'none';
        }

        // Actualizar vista (imagen o reproductor de video) y metadatos en el lightbox
        function updateLightboxView() {
            const current = lightboxImages[lightboxCurrentIndex];
            if (!current) return;

            stopLightboxVideo();

            if (current.isVideo) {
                lightboxImg.style.display = 'none';
                lightboxImg.src = '';

                lightboxVideo.style.display = 'block';
                lightboxVideo.src = current.src;
                const playPromise = lightboxVideo.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
                lightboxCopyBtn.innerHTML = '<i class="fas fa-link"></i> Copiar URL';
            } else {
                lightboxImg.style.display = 'block';
                lightboxImg.src = current.src;
                lightboxImg.alt = current.alt || '';
                lightboxCopyBtn.innerHTML = '<i class="fas fa-copy"></i> Copiar';
            }

            lightboxCounter.textContent = `${lightboxCurrentIndex + 1} / ${lightboxImages.length}`;
            lightboxCaptionText.textContent = current.folder
                ? `${current.folder} — ${current.name}`
                : current.name;

            const showNav = lightboxImages.length > 1;
            lightboxPrev.style.display = showNav ? 'flex' : 'none';
            lightboxNext.style.display = showNav ? 'flex' : 'none';
        }

        // Abrir/cerrar lightbox (ampliar imagen o reproducir video)
        function toggleLightbox(mediaSrc) {
            if (
                lightbox.classList.contains('active') &&
                lightboxImages[lightboxCurrentIndex] &&
                lightboxImages[lightboxCurrentIndex].src === mediaSrc
            ) {
                closeLightbox();
                return;
            }

            const foundIndex = lightboxImages.findIndex(item => item.src === mediaSrc);
            if (foundIndex !== -1) {
                lightboxCurrentIndex = foundIndex;
            } else {
                lightboxImages.unshift({
                    src: mediaSrc,
                    alt: '',
                    name: mediaSrc.split('/').pop() || '',
                    isVideo: isVideoItem({ url: mediaSrc })
                });
                lightboxCurrentIndex = 0;
            }

            updateLightboxView();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Cerrar lightbox deteniendo cualquier reproducción activa
        function closeLightbox() {
            stopLightboxVideo();
            lightbox.classList.remove('active');
            lightboxImg.src = '';
            document.body.style.overflow = '';
        }

        // Navegar a elemento anterior en lightbox
        function prevImage() {
            if (lightboxImages.length <= 1) return;
            lightboxCurrentIndex = (lightboxCurrentIndex - 1 + lightboxImages.length) % lightboxImages.length;
            updateLightboxView();
        }

        // Navegar a elemento siguiente en lightbox
        function nextImage() {
            if (lightboxImages.length <= 1) return;
            lightboxCurrentIndex = (lightboxCurrentIndex + 1) % lightboxImages.length;
            updateLightboxView();
        }

        // Inicializar todos los listeners del lightbox (desktop + iOS touch + teclado + swipe)
        function initLightbox() {
            lightboxClose.addEventListener('click', closeLightbox);

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            lightboxClose.addEventListener('touchend', (e) => {
                e.preventDefault();
                closeLightbox();
            }, { passive: false });

            lightbox.addEventListener('touchend', (e) => {
                if (e.target === lightbox) {
                    e.preventDefault();
                    closeLightbox();
                }
            }, { passive: false });

            lightboxPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                prevImage();
            });

            lightboxNext.addEventListener('click', (e) => {
                e.stopPropagation();
                nextImage();
            });

            lightboxCopyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const current = lightboxImages[lightboxCurrentIndex];
                if (current && current.src) {
                    if (current.isVideo) {
                        copyImageToClipboard(current.src, true);
                    } else {
                        toggleCopySelection(current.src, current.name || '');
                    }
                }
            });

            // Soporte de swipe horizontal en móvil / iOS (ignorando controles nativos de video)
            let touchStartX = 0;
            let touchStartY = 0;
            let swipeIgnore = false;

            lightbox.addEventListener('touchstart', (e) => {
                swipeIgnore = (e.target === lightboxVideo);
                if (e.changedTouches && e.changedTouches.length > 0) {
                    touchStartX = e.changedTouches[0].screenX;
                    touchStartY = e.changedTouches[0].screenY;
                }
            }, { passive: true });

            lightbox.addEventListener('touchend', (e) => {
                if (swipeIgnore || !lightbox.classList.contains('active')) return;
                if (!e.changedTouches || e.changedTouches.length === 0) return;
                const dx = e.changedTouches[0].screenX - touchStartX;
                const dy = e.changedTouches[0].screenY - touchStartY;
                if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) {
                        prevImage();
                    } else {
                        nextImage();
                    }
                }
            }, { passive: true });

            // Navegación y cierre por teclado
            document.addEventListener('keydown', (e) => {
                if (lightbox.classList.contains('active')) {
                    if (e.key === 'Escape') {
                        closeLightbox();
                    } else if (e.key === 'ArrowLeft') {
                        prevImage();
                    } else if (e.key === 'ArrowRight') {
                        nextImage();
                    }
                } else if (mdViewer.classList.contains('active') && e.key === 'Escape') {
                    closeMdViewer();
                }
            });
        }

        // Mostrar notificación toast con mensaje configurable sin corromper estado posterior
        function showToast(message = 'Copiado al portapapeles', isError = false) {
            if (toastTimer) {
                clearTimeout(toastTimer);
            }
            toast.textContent = message;
            toast.classList.toggle('is-error', Boolean(isError));
            toast.classList.add('show');
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Manejar cambio en checkbox "Mostrar referencias"
        function toggleFilter(checkbox) {
            const isChecked = Boolean(checkbox && checkbox.checked);
            currentFilter = isChecked ? 'reference' : 'hide-reference';
            if (filterLabel) {
                filterLabel.classList.toggle('is-checked', isChecked);
            }
            writePersistedState({
                filter: currentFilter,
                scrollY: Math.round(window.scrollY || window.pageYOffset || 0),
                renderedCount: batchSize
            });
            resetPaginationAndRender();
        }

        // Filtrar por término de búsqueda en carpeta, archivo, extensión o tipo ("video")
        function filterBySearch() {
            currentSearch = searchInput ? searchInput.value.trim() : '';
            if (searchClear) {
                searchClear.classList.toggle('visible', currentSearch.length > 0);
            }
            writePersistedState({
                search: currentSearch,
                scrollY: Math.round(window.scrollY || window.pageYOffset || 0),
                renderedCount: batchSize
            });
            syncUrlWithSearch();
            resetPaginationAndRender();
        }

        // Convertir URL de imagen a Blob PNG mediante Canvas
        function imageUrlToPngBlob(imgSrc) {
            return new Promise((resolve, reject) => {
                const tempImage = new Image();
                tempImage.crossOrigin = 'anonymous';
                tempImage.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = tempImage.naturalWidth || tempImage.width;
                        canvas.height = tempImage.naturalHeight || tempImage.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(tempImage, 0, 0);
                        canvas.toBlob((blob) => {
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error('No se pudo convertir la imagen a PNG'));
                            }
                        }, 'image/png');
                    } catch (err) {
                        reject(err);
                    }
                };
                tempImage.onerror = () => reject(new Error('No se pudo cargar la imagen para copiar'));
                tempImage.src = imgSrc;
            });
        }

        // Fallback universal para copiar texto (soporta contextos HTTP sin navigator.clipboard e iOS)
        async function copyTextFallback(text) {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                await navigator.clipboard.writeText(text);
                return true;
            }

            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.setAttribute('readonly', '');
            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            textArea.setSelectionRange(0, text.length);

            let copied = false;
            try {
                copied = document.execCommand('copy');
            } finally {
                document.body.removeChild(textArea);
            }

            if (!copied) {
                throw new Error('execCommand copy falló');
            }
            return true;
        }

        // Copiar imagen PNG al portapapeles (o enlace directo si es un archivo de video)
        async function copyImageToClipboard(mediaSrc, forceUrlCopy = false) {
            const absoluteUrl = new URL(mediaSrc, window.location.href).href;

            if (forceUrlCopy || isVideoItem({ url: mediaSrc })) {
                try {
                    await copyTextFallback(absoluteUrl);
                    showToast('URL del video copiada al portapapeles');
                } catch (err) {
                    console.error('Error al copiar URL del video:', err);
                    showToast('No se pudo copiar el enlace del video', true);
                }
                return;
            }

            if (
                navigator.clipboard &&
                typeof navigator.clipboard.write === 'function' &&
                typeof window.ClipboardItem !== 'undefined'
            ) {
                try {
                    const pngPromise = imageUrlToPngBlob(mediaSrc);
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': pngPromise })
                        ]);
                    } catch (syncItemError) {
                        const resolvedBlob = await pngPromise;
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': resolvedBlob })
                        ]);
                    }
                    showToast('Copiado al portapapeles');
                    return;
                } catch (imgCopyErr) {
                    // Continuar al fallback de URL de texto
                }
            }

            // Sin contexto seguro (http://) el navegador no expone la Clipboard API y no se
            // puede copiar el bitmap. No se copia la URL: se avisa y se deja el portapapeles intacto.
            if (!window.isSecureContext || !navigator.clipboard || typeof navigator.clipboard.write !== 'function') {
                //showToast('Para copiar la imagen, abre el catálogo con https:// o en localhost', true);
            } else {
                showToast('No se pudo copiar la imagen al portapapeles', true);
            }
            console.error('No se pudo copiar la imagen:', absoluteUrl);
        }

        // ------------------------------------------------------------------
        // Selección múltiple de imágenes para copiar al portapapeles
        // ------------------------------------------------------------------
        function getCopySelectionKey(src) {
            try {
                return new URL(src, window.location.href).href;
            } catch (error) {
                return String(src || '');
            }
        }

        // Refleja en las miniaturas y en la barra el estado de la selección actual
        function syncCopySelectionUi() {
            foldersList.querySelectorAll('.folder-image[data-type="image"]').forEach(card => {
                const src = card.getAttribute('data-src') || '';
                const isSelected = copySelection.has(getCopySelectionKey(src));
                card.classList.toggle('is-copy-selected', isSelected);

                const copyIcon = card.querySelector('.copy-icon');
                if (copyIcon) {
                    copyIcon.setAttribute('aria-pressed', String(isSelected));
                    copyIcon.title = isSelected ? 'Quitar de la selección' : 'Añadir a la selección';
                    const icon = copyIcon.querySelector('i');
                    if (icon) {
                        icon.className = isSelected ? 'fas fa-check' : 'fas fa-copy';
                    }
                }
            });

            if (copyTray) {
                const count = copySelection.size;
                copyTray.hidden = count === 0;
                if (copyTrayCount) {
                    copyTrayCount.textContent = count === 1
                        ? '1 imagen lista'
                        : `${count} imágenes listas`;
                }
            }
        }

        // Escribe todas las imágenes seleccionadas como varios ClipboardItem.
        // El sistema puede aceptar solo una, así que se avisa al usuario.
        async function writeCopySelectionToClipboard(options = {}) {
            const notify = options.notify !== false;
            const entries = Array.from(copySelection.values());
            if (entries.length === 0) return false;

            // Una sola imagen: usar el copiado normal original (sí soportado por el navegador)
            if (entries.length === 1) {
                await copyImageToClipboard(entries[0].src);
                return true;
            }

            if (
                navigator.clipboard &&
                typeof navigator.clipboard.write === 'function' &&
                typeof window.ClipboardItem !== 'undefined'
            ) {
                try {
                    const items = entries.map(entry => new ClipboardItem({
                        'image/png': imageUrlToPngBlob(entry.src)
                    }));
                    await navigator.clipboard.write(items);
                    if (notify) {
                        showToast(entries.length === 1
                            ? 'Imagen copiada al portapapeles'
                            : `${entries.length} imágenes copiadas (el sistema puede pegar solo una)`);
                    }
                    return true;
                } catch (multiError) {
                    // Chrome no soporta varios ClipboardItem: copiar la última añadida
                    try {
                        const last = entries[entries.length - 1];
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': imageUrlToPngBlob(last.src) })
                        ]);
                        if (notify) {
                            showToast(
                                entries.length > 1
                                    ? `${entries.length} imágenes en la selección; el sistema copió la última`
                                    : 'Imagen copiada al portapapeles',
                                entries.length > 1
                            );
                        }
                        return true;
                    } catch (singleError) {
                        // Continuar al fallback de enlaces
                    }
                }
            }

            // Nunca se copian las URL de las imágenes: si el navegador no puede copiar los
            // bitmaps (p. ej. origen http://), se avisa y no se toca el portapapeles.
            if (notify) {
                if (!window.isSecureContext || !navigator.clipboard) {
                    //showToast('Para copiar imágenes, abre el catálogo con https:// o en localhost', true);
                } else {
                    showToast('No se pudieron copiar las imágenes', true);
                }
            }
            return false;
        }

        // Añade o quita una imagen de la selección y actualiza el portapapeles al añadir
        async function toggleCopySelection(src, name = '') {
            if (!src) return;
            const key = getCopySelectionKey(src);
            const wasSelected = copySelection.has(key);

            if (wasSelected) {
                copySelection.delete(key);
                syncCopySelectionUi();
                if (copySelection.size > 0) {
                    await writeCopySelectionToClipboard({ notify: false });
                }
                showToast('Imagen quitada de la selección');
                return;
            }

            copySelection.set(key, { src, name });
            syncCopySelectionUi();
            await writeCopySelectionToClipboard();
        }

        function clearCopySelection() {
            copySelection.clear();
            syncCopySelectionUi();
            showToast('Selección vaciada');
        }

        // Renderizar Markdown a HTML de forma compatible con marked@4.3.0.
        // El HTML generado se sanea con DOMPurify antes de insertarlo: un .md
        // nunca debe poder ejecutar scripts ni inyectar manejadores de eventos.
        function renderMarkdownToHtml(markdownText) {
            let html = null;
            if (window.marked) {
                if (typeof window.marked.parse === 'function') {
                    html = window.marked.parse(markdownText);
                } else if (typeof window.marked === 'function') {
                    html = window.marked(markdownText);
                }
            }
            if (html === null) {
                return `<pre>${escapeHtml(markdownText)}</pre>`;
            }
            if (window.DOMPurify && typeof window.DOMPurify.sanitize === 'function') {
                return window.DOMPurify.sanitize(html, {
                    USE_PROFILES: { html: true },
                    FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select', 'option'],
                    FORBID_ATTR: ['style']
                });
            }
            // Sin DOMPurify no se renderiza HTML: se muestra el texto escapado.
            return `<pre>${escapeHtml(markdownText)}</pre>`;
        }

        // Resolver enlaces relativos entre archivos .md (ej. "../../generar_imagen.md")
        function resolveRelativeMdPath(baseFilePath, href) {
            const cleanBase = String(baseFilePath || '').replace(/\\/g, '/');
            const baseParts = cleanBase.split('/');
            baseParts.pop();
            const relParts = String(href || '').split('/');
            for (const part of relParts) {
                if (!part || part === '.') continue;
                if (part === '..') {
                    baseParts.pop();
                } else {
                    baseParts.push(part);
                }
            }
            return baseParts.join('/');
        }

        // Cargar y mostrar archivo .md en el modal
        function cargarMdContent(filePath, titleLabel = '') {
            currentMdPath = filePath;
            mdTitleText.textContent = titleLabel || filePath.split('/').pop() || 'Documento Markdown';
            mdContent.innerHTML = '<p style="color: var(--muted);">Cargando documento...</p>';
            mdViewer.classList.add('active');
            document.body.style.overflow = 'hidden';

            fetch(`md.php?file=${encodeURIComponent(filePath)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`No se pudo abrir el archivo (HTTP ${response.status})`);
                    }
                    return response.text();
                })
                .then(content => {
                    mdContent.innerHTML = renderMarkdownToHtml(content);
                })
                .catch(error => {
                    mdContent.innerHTML = `<p style="color: #ef4444;">Error cargando el archivo .md: ${escapeHtml(error.message)}</p>`;
                });
        }

        function closeMdViewer() {
            mdViewer.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Actualiza textos y estado accesible de una flecha de colapso
        function updateCollapseButtonState(button, isCollapsed, kind) {
            const label = button.getAttribute('data-folder-label') || '';
            button.setAttribute('aria-expanded', String(!isCollapsed));
            button.title = `${isCollapsed ? 'Expandir' : 'Colapsar'} ${kind}`;
            button.setAttribute(
                'aria-label',
                `${isCollapsed ? 'Expandir' : 'Colapsar'} ${kind}${label ? ' ' + label : ''}`
            );
        }

        // Delegación de eventos en galería (imagen, tarjeta de video, lupa/play, copiar y botones .md)
        foldersList.addEventListener('click', (e) => {
            const collapseBtn = e.target.closest('.folder-collapse-btn');
            if (collapseBtn) {
                e.stopPropagation();
                const card = collapseBtn.closest('.folder-card');
                if (!card) return;
                const isCollapsed = card.classList.toggle('is-collapsed');
                updateCollapseButtonState(collapseBtn, isCollapsed, 'carpeta');
                return;
            }

            const subCollapseBtn = e.target.closest('.subfolder-collapse-btn');
            if (subCollapseBtn) {
                e.stopPropagation();
                const block = subCollapseBtn.closest('.subfolder-block');
                if (!block) return;
                const isCollapsed = block.classList.toggle('is-collapsed');
                updateCollapseButtonState(subCollapseBtn, isCollapsed, 'subcarpeta');

                // Ocultar también las subcarpetas descendientes mientras el grupo esté colapsado
                const currentDepth = Number(block.getAttribute('data-depth') || 1);
                let sibling = block.nextElementSibling;
                while (sibling && sibling.classList.contains('subfolder-block')) {
                    const siblingDepth = Number(sibling.getAttribute('data-depth') || 0);
                    if (siblingDepth <= currentDepth) break;
                    sibling.classList.toggle('is-hidden-by-parent', isCollapsed);
                    sibling = sibling.nextElementSibling;
                }
                return;
            }

            const mdBtn = e.target.closest('.md-btn');
            if (mdBtn) {
                e.stopPropagation();
                const path = mdBtn.getAttribute('data-md-path');
                const title = mdBtn.getAttribute('data-md-title') || '';
                if (path) cargarMdContent(path, title);
                return;
            }

            const copyBtn = e.target.closest('.copy-icon');
            if (copyBtn) {
                e.stopPropagation();
                const item = copyBtn.closest('.folder-image');
                const src = item ? item.getAttribute('data-src') : '';
                const videoFlag = Boolean(item && item.classList.contains('is-video'));
                if (src) {
                    if (videoFlag) {
                        copyImageToClipboard(src, true);
                    } else {
                        toggleCopySelection(src, item.getAttribute('data-filename') || '');
                    }
                }
                return;
            }

            const zoomOrPlayBtn = e.target.closest('.zoom-icon');
            if (zoomOrPlayBtn) {
                e.stopPropagation();
                const item = zoomOrPlayBtn.closest('.folder-image');
                const src = item ? item.getAttribute('data-src') : '';
                if (src) toggleLightbox(src);
                return;
            }

            const mediaCard = e.target.closest('.folder-image');
            if (mediaCard) {
                const src = mediaCard.getAttribute('data-src');
                if (src) toggleLightbox(src);
            }
        });

        // Soporte accesible con teclado (Enter / Space) en iconos lupa/play y copiar
        foldersList.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const actionIcon = e.target.closest('.zoom-icon, .copy-icon');
            if (!actionIcon) return;
            e.preventDefault();
            actionIcon.click();
        });

        // Delegación para botones .md de la raíz del proyecto
        if (rootDocs) {
            rootDocs.addEventListener('click', (e) => {
                const mdBtn = e.target.closest('.md-btn');
                if (!mdBtn) return;
                const path = mdBtn.getAttribute('data-md-path');
                const title = mdBtn.getAttribute('data-md-title') || '';
                if (path) cargarMdContent(path, title);
            });
        }

        // Interceptar enlaces internos .md dentro del visor Markdown para abrirlos sin salir de la SPA
        mdContent.addEventListener('click', (e) => {
            const anchor = e.target.closest('a');
            if (!anchor) return;
            const href = anchor.getAttribute('href') || '';
            if (!href || /^https?:\/\//i.test(href) || href.startsWith('#')) return;
            if (href.toLowerCase().endsWith('.md')) {
                e.preventDefault();
                const resolved = resolveRelativeMdPath(currentMdPath, href);
                cargarMdContent(resolved, resolved);
            }
        });

        // Cerrar modal .md (click + touch iOS)
        mdClose.addEventListener('click', closeMdViewer);
        mdClose.addEventListener('touchend', (e) => {
            e.preventDefault();
            closeMdViewer();
        }, { passive: false });

        mdViewer.addEventListener('click', (e) => {
            if (e.target === mdViewer) {
                closeMdViewer();
            }
        });
        mdViewer.addEventListener('touchend', (e) => {
            if (e.target === mdViewer) {
                e.preventDefault();
                closeMdViewer();
            }
        }, { passive: false });

        // Inicializar estado persistido: filtro, búsqueda y posición de lectura
        const initialState = resolveInitialState();
        currentFilter = initialState.filter;
        currentSearch = initialState.search;
        pendingInitialScrollY = initialState.scrollY;
        pendingInitialRenderCount = initialState.renderedCount;

        filterCheckbox.checked = (currentFilter === 'reference');
        filterLabel.classList.toggle('is-checked', filterCheckbox.checked);
        if (searchInput) {
            searchInput.value = currentSearch;
        }
        if (searchClear) {
            searchClear.classList.toggle('visible', currentSearch.length > 0);
        }

        // Renderizar el historial (queda oculto hasta enfocar el buscador)
        renderSearchHistory();

        // Guardar la posición con throttling y también al cerrar u ocultar la pestaña
        window.addEventListener('scroll', scheduleScrollSave, { passive: true });
        window.addEventListener('pagehide', saveScrollPosition);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                saveScrollPosition();
            }
        });

        // Inicialización de filtro checkbox
        filterCheckbox.addEventListener('change', () => toggleFilter(filterCheckbox));

        // Inicialización de buscador
        searchInput.addEventListener('input', filterBySearch);
        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            filterBySearch();
            closeSearchHistory();
            searchInput.focus();
        });

        // Combo box de búsquedas recientes
        searchInput.addEventListener('focus', () => {
            renderSearchHistory();
            openSearchHistory();
        });

        searchInput.addEventListener('click', () => {
            renderSearchHistory();
            openSearchHistory();
        });

        searchInput.addEventListener('keydown', (e) => {
            const isOpen = searchHistory && !searchHistory.hidden;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!isOpen) {
                    openSearchHistory();
                } else {
                    const total = recentSearches.length;
                    const next = searchHistoryActiveIndex + 1;
                    setActiveHistoryItem(next >= total ? 0 : next);
                }
                return;
            }
            if (e.key === 'ArrowUp') {
                if (!isOpen) return;
                e.preventDefault();
                const total = recentSearches.length;
                const prev = searchHistoryActiveIndex - 1;
                setActiveHistoryItem(prev < 0 ? total - 1 : prev);
                return;
            }
            if (e.key === 'Enter') {
                if (isOpen && searchHistoryActiveIndex >= 0) {
                    e.preventDefault();
                    const term = recentSearches[searchHistoryActiveIndex];
                    if (term) applyRecentSearch(term);
                    return;
                }
                recordRecentSearch(searchInput.value);
                closeSearchHistory();
                return;
            }
            if (e.key === 'Escape') {
                if (isOpen) {
                    e.preventDefault();
                    closeSearchHistory();
                }
                return;
            }
            if (e.key === 'Tab') {
                closeSearchHistory();
            }
        });

        // Mantiene el foco del input al pulsar una opción del historial
        if (searchHistory) {
            searchHistory.addEventListener('mousedown', (e) => {
                e.preventDefault();
            });
            searchHistory.addEventListener('click', (e) => {
                const item = e.target.closest('.search-history-item');
                if (!item) return;
                const term = item.getAttribute('data-search-term') || '';
                if (term) applyRecentSearch(term);
            });
        }

        // Registra la búsqueda al abandonar el campo y cierra el combo
        searchInput.addEventListener('blur', () => {
            setTimeout(() => {
                const active = document.activeElement;
                if (active !== searchInput && !(searchHistory && searchHistory.contains(active))) {
                    closeSearchHistory();
                }
            }, 120);
            recordRecentSearch(searchInput.value);
        });

        // Cerrar el combo al hacer clic fuera del buscador
        document.addEventListener('click', (e) => {
            if (!searchBox || searchBox.contains(e.target)) return;
            closeSearchHistory();
        });

        // Guardar también la búsqueda actual al cerrar u ocultar la pestaña
        window.addEventListener('pagehide', () => {
            if (searchInput) recordRecentSearch(searchInput.value);
        });

        // Barra de imágenes seleccionadas para copiar en conjunto
        if (copyTrayCopyBtn) {
            copyTrayCopyBtn.addEventListener('click', () => {
                writeCopySelectionToClipboard();
            });
        }
        if (copyTrayClearBtn) {
            copyTrayClearBtn.addEventListener('click', clearCopySelection);
        }

        // Mantener compensación exacta del header fijo en desktop y móvil
        updateHeaderOffset();
        window.addEventListener('resize', updateHeaderOffset);
        if ('ResizeObserver' in window && appHeader) {
            new ResizeObserver(updateHeaderOffset).observe(appHeader);
        }

        // Inicializar lightbox y cargar carpetas
        initLightbox();
        cargarFolders();
    </script>

    <!-- Mini Google Analytics: visita anónima, sin cookies de terceros -->
    <script>
    (function () {
        'use strict';
        var endpoint = 'administracion/track.php';
        var visitante = null;

        try {
            visitante = localStorage.getItem('sublilaservinyl_vid');
        } catch (_) { /* almacenamiento bloqueado */ }

        if (!visitante) {
            visitante = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
            try {
                localStorage.setItem('sublilaservinyl_vid', visitante);
            } catch (_) { /* ignorar */ }
        }

        var ultimaRuta = null;

        function rutaActual() {
            var hash = window.location.hash || '';
            return hash ? hash.replace(/^#/, '') : 'index.html';
        }

        function enviarVisita() {
            var ruta = rutaActual();
            if (ruta === ultimaRuta) return;
            ultimaRuta = ruta;

            var datos = {
                v: visitante,
                ruta: ruta,
                ref: document.referrer || '',
                idioma: navigator.language || '',
                pantalla: (window.screen ? screen.width + 'x' + screen.height : '')
            };
            var cuerpo = JSON.stringify(datos);

            try {
                if (navigator.sendBeacon) {
                    var blob = new Blob([cuerpo], { type: 'application/json' });
                    if (navigator.sendBeacon(endpoint, blob)) return;
                }
                fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: cuerpo,
                    keepalive: true,
                    credentials: 'omit'
                }).catch(function () { /* analítica no bloquea la web */ });
            } catch (_) { /* ignorar */ }
        }

        if (document.readyState === 'complete') {
            setTimeout(enviarVisita, 0);
        } else {
            window.addEventListener('load', enviarVisita, { once: true });
        }
        window.addEventListener('hashchange', enviarVisita);
    })();
    </script>
